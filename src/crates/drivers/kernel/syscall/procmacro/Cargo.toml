[package]
name = "smeg-drivers-kernel-syscall-procmacro"
version = "0.1.0"
authors = ["Pete Restall <pete@restall.net>"]
edition = "2024"
rust-version = "1.101"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

[dev-dependencies]
fluent-test = "0.4.3"

[features]
no_default_syscall_invocation = []
