[package]
name = "smeg-kernel"
version = "0.1.0"
edition = "2024"
authors = ["Pete Restall <pete@restall.net>"]

[dependencies]
include-utils = { version = "0.2.4", features = ["workspace"] }
smeg-config = { path = "../config" }
smeg-kernel-procmacro = { path = "procmacro" }

[dev-dependencies]
fluent-test = "0.4.3"
smeg-testing-host-utils = { path = "../testing/host-utils" }
smeg-testing-integration = { path = "../testing/integration" }

[features]
std = ["smeg-config/std"]
no_bootstrapping_bss_data_bounds_checks = []
no_default_despair = []
