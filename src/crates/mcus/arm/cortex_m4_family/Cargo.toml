[package]
name = "smeg-mcu-arm-cortex_m4_family"
version = "0.1.0"
edition = "2024"
authors = ["Pete Restall <pete@restall.net>"]

[dependencies]
cfg-if = "1.0.0"
include-utils = { version = "0.2.4", features = ["workspace"] }
smeg-kernel = { path = "../../../kernel" }
smeg-testing-host-utils = { path = "../../../testing/host-utils", optional = true }

[dev-dependencies]
smeg-testing-integration = { path = "../../../testing/integration" }

[features]
std = ["smeg-kernel/std"]
test_doubles = ["dep:smeg-testing-host-utils"]
