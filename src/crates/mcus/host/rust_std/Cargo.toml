[package]
name = "smeg-mcu-host-rust_std"
version = "0.1.0"
edition = "2024"
authors = ["Pete Restall <pete@restall.net>"]

[dependencies]
smeg-config = { path = "../../../config" }
smeg-kernel = { path = "../../../kernel" }

[dev-dependencies]
fluent-test = "0.4.3"
smeg-testing-host-utils = { path = "../../../testing/host-utils" }
smeg-testing-integration = { path = "../../../testing/integration" }

[features]
default = ["std"]
std = ["smeg-kernel/std"]
test_doubles = ["smeg-kernel/test_doubles"]
