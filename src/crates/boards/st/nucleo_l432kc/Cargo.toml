[package]
name = "smeg-board-st-nucleo_l432kc"
version = "0.1.0"
edition = "2024"
authors = ["Pete Restall <pete@restall.net>"]

[dependencies]
cfg-if = "1.0.0"
smeg-kernel = { path = "../../../kernel" }
smeg-mcu-arm-cortex_m4_family = { path = "../../../mcus/arm/cortex_m4_family" }
smeg-mcu-st-stm32l432kc = { path = "../../../mcus/st/stm32l432kc" }
smeg-drivers-kernel-syscall = { path = "../../../drivers/kernel/syscall", features = ["smeg-mcu-arm-cortex_m4_family"] }

[dev-dependencies]
smeg-testing-integration = { path = "../../../testing/integration" }

[features]
std = ["smeg-kernel/std", "smeg-mcu-st-stm32l432kc/std"]
test_doubles = ["smeg-drivers-kernel-syscall/test_doubles"]
